kind: Deployment
apiVersion: apps/v1
metadata:
  name: traefik-deployment
  namespace: traefik
  labels:
    app: traefik
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik-account
      containers:
        - name: traefik
          image: traefik:v3.3
          args:
            - --api.insecure
            - --providers.kubernetesIngress
            - --providers.kubernetesCRD
            - --entrypoints.web.address=:80
            - --entrypoints.playzir-mc.address=:25565
            - --entrypoints.vintagestory.address=:42420
            - --entrypoints.terraria.address=:7777
            - --entrypoints.palworld.address=:8211
          ports:
            - name: web
              containerPort: 80
            - name: dashboard
              containerPort: 8080
            - name: playzir-mc
              containerPort: 25565
            - name: vintagestory
              containerPort: 42420
            - name: terraria
              containerPort: 7777
            - name: palworld
              containerPort: 8211