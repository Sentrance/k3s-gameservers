apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-palworld
  namespace: palworld
  labels:
    type: local
spec:
  storageClassName: storage-palworld
  capacity:
    storage: 30Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/pv-palworld"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-palworld
  namespace: palworld
spec:
  storageClassName: storage-palworld
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 12Gi