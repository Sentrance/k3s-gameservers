apiVersion: apps/v1
kind: Deployment
metadata:
  name: palworld-deployment
  namespace: palworld
  labels:
    app.kubernetes.io/name: palworld-deployment
    app: palworld
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: palworld
  template:
    metadata:
      labels:
        app: palworld
    spec:
      containers:
        - name: palworld-server
          image: thijsvanloef/palworld-server-docker:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: PORT
              value: "8211"
            - name: PLAYERS
              value: "16"
            - name: MULTITHREADING
              value: "true"
            - name: COMMUNITY
              value: "false"
            - name: SERVER_NAME
              value: "Playzir"
            - name: SERVER_DESCRIPTION
              value: "Private server for Playzir"
            - name: TZ
              value: "Europe/Paris"
            # --- Passwords: pulled from the palworld-secrets Secret ---
            - name: SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: palworld-secrets
                  key: server-password
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: palworld-secrets
                  key: admin-password
          volumeMounts:
            - mountPath: "/palworld"
              name: pv-deployment-palworld
          ports:
            - containerPort: 8211
              name: palworld-server
              protocol: UDP
          resources:
            requests:
              memory: 6Gi
              cpu: "1"
            limits:
              memory: 12Gi
              cpu: "3"
      volumes:
        - name: pv-deployment-palworld
          persistentVolumeClaim:
            claimName: pvc-palworld